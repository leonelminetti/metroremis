<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Ruta y distancia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css"
  />
  <style>
    #map { height: 100vh; }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: white;
      padding: 10px;
      z-index: 1000;
      font-family: sans-serif;
      box-shadow: 0 0 5px #aaa;
    }
  </style>
</head>
<body>
  <div id="info">Distancia: <span id="distancia">Calculando...</span></div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.min.js"></script>

  <script>
    const map = L.map('map').setView([-34.6037, -58.3816], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const puntoA = L.latLng(-31.423324, -63.031796);
    const puntoB = L.latLng(-31.419572, -63.045834);

    const control = L.Routing.control({
      waypoints: [puntoA, puntoB],
      routeWhileDragging: true,
      router: L.Routing.osrmv1({
        serviceUrl: 'https://router.project-osrm.org/route/v1'
      }),
      showAlternatives: false
    }).addTo(map);

    control.on('routesfound', function(e) {
      const route = e.routes[0];
      const distancia = route.summary.totalDistance; // en metros
      console.log((distancia/100)*95 + 1700);
      document.getElementById('distancia').textContent = `${distancia.toFixed(0)} m`;
    });
  </script>
</body>
</html>
