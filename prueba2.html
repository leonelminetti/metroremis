<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Ruta y distancia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
  <style>
    #map { height: 100vh; }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: white;
      padding: 10px;
      z-index: 1000;
      font-family: sans-serif;
      box-shadow: 0 0 5px #aaa;
    }
  </style>
</head>
<body>
  <div id="info">Distancia: <span id="distancia">Calculando...</span></div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.min.js"></script>

  <script>
    const map = L.map('map').setView([-31.418134, -63.051320], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let puntoA = L.latLng(-31.423324, -63.031796);
    let puntoB = L.latLng(-31.419572, -63.045834);

    // Iconos A y B
    const iconoA = L.divIcon({
      html: '<div style="background:#1976d2;color:white;width:24px;height:24px;border-radius:50%;text-align:center;line-height:24px;font-weight:bold;">A</div>',
      iconSize: [24, 24],
      className: ''
    });

    const iconoB = L.divIcon({
      html: '<div style="background:#d32f2f;color:white;width:24px;height:24px;border-radius:50%;text-align:center;line-height:24px;font-weight:bold;">B</div>',
      iconSize: [24, 24],
      className: ''
    });

    // Marcadores arrastrables
    const marcadorA = L.marker(puntoA, { icon: iconoA, draggable: true }).addTo(map);
    const marcadorB = L.marker(puntoB, { icon: iconoB, draggable: true }).addTo(map);

    // Ruta
    const control = L.Routing.control({
      waypoints: [puntoA, puntoB],
      createMarker: () => null,
      routeWhileDragging: false,
      router: L.Routing.osrmv1({
        serviceUrl: 'https://router.project-osrm.org/route/v1'
      }),
      showAlternatives: false
    }).addTo(map);

    // Actualizar ruta cuando se mueven los marcadores
    function actualizarRuta() {
      const nuevaA = marcadorA.getLatLng();
      const nuevaB = marcadorB.getLatLng();
      control.setWaypoints([nuevaA, nuevaB]);
    }

    marcadorA.on('dragend', actualizarRuta);
    marcadorB.on('dragend', actualizarRuta);

    // Mostrar distancia y costo
    control.on('routesfound', function(e) {
      const route = e.routes[0];
      const distancia = route.summary.totalDistance; // en metros
      const costo = (distancia / 100) * 95 + 1700;
      document.getElementById('distancia').textContent = `${distancia.toFixed(0)} m – $${costo.toFixed(2)}`;
    });
  </script>
</body>
</html>
